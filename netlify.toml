[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Turnstile site key is public by design (NEXT_PUBLIC_) and must appear in the JS bundle.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_TURNSTILE_SITE_KEY"

# Next.js App Router is adapted automatically (OpenNext).
# Do not pin @netlify/plugin-nextjs unless you need a specific runtime.
